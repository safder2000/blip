name: release

# Push a tag like v0.2.0 -> tests, Blip.exe (PyInstaller), BlipSetup-0.2.0.exe (Inno Setup),
# and a GitHub release with the setup + its .sha256. Installed Blips pick it up on their own.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller==6.11.1

      - name: Stamp version
        shell: pwsh
        env:
          BC_CLIENT_ID: ${{ secrets.BASECAMP_CLIENT_ID }}
          BC_CLIENT_SECRET: ${{ secrets.BASECAMP_CLIENT_SECRET }}
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python packaging/stamp.py $v

      - name: Tests
        run: python -m unittest discover -s tests -t . -v

      - name: Build Blip.exe
        run: pyinstaller --noconfirm --clean --windowed --name Blip --icon assets/blip.ico blip_main.pyw

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /DMyAppVersion=$env:VERSION packaging\blip.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "BlipSetup-$env:VERSION.exe"
          $exe = "dist\$name"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -FilePath "$exe.sha256" -Encoding ascii -NoNewline
          gh release create "${{ github.ref_name }}" $exe "$exe.sha256" --title "Blip $env:VERSION" --generate-notes
