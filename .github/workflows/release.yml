name: release

# Push a tag like v0.5.0 ->
#   Windows: tests, Blip.exe (PyInstaller), BlipSetup-0.5.0.exe (Inno Setup), GitHub release
#   macOS:   tests, Blip.app (PyInstaller), Blip-mac-arm64.zip added to the same release
# Every file gets a .sha256 next to it. Installed Blips pick the new version up on their own.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # re-run just the Mac build for an existing release
    inputs:
      tag:
        description: "Release tag, e.g. v0.5.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller==6.11.1 pystray==0.19.5 pillow==11.0.0 sounddevice==0.5.1

      - name: Stamp version
        shell: pwsh
        env:
          BC_CLIENT_ID: ${{ secrets.BASECAMP_CLIENT_ID }}
          BC_CLIENT_SECRET: ${{ secrets.BASECAMP_CLIENT_SECRET }}
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python packaging/stamp.py $v

      - name: Tests
        run: python -m unittest discover -s tests -t . -v

      - name: Get libopus (voice compression)
        shell: pwsh
        run: |
          python -m pip download discord.py==2.4.0 --no-deps -d opusdl
          New-Item -ItemType Directory -Force vendor | Out-Null
          python -c "import zipfile,glob; z=zipfile.ZipFile(glob.glob('opusdl/*.whl')[0]); open('vendor/opus.dll','wb').write(z.read('discord/bin/libopus-0.x64.dll'))"

      - name: Build Blip.exe
        run: pyinstaller --noconfirm --clean --windowed --name Blip --icon assets/blip.ico --hidden-import pystray._win32 --add-binary "vendor/opus.dll;." blip_main.pyw

      - name: Check the bundled Opus works
        shell: pwsh
        run: |
          $p = Start-Process dist\Blip\Blip.exe -ArgumentList "--selftest-opus" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "libopus missing from the build"; exit 1 }
          "opus ok"

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /DMyAppVersion=$env:VERSION packaging\blip.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "BlipSetup-$env:VERSION.exe"
          $exe = "dist\$name"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -FilePath "$exe.sha256" -Encoding ascii -NoNewline
          gh release create "${{ github.ref_name }}" $exe "$exe.sha256" --title "Blip $env:VERSION" --generate-notes

  mac:
    needs: build
    if: always() && (needs.build.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade pip pyinstaller==6.11.1 pillow==11.0.0 sounddevice==0.5.1 certifi==2024.8.30

      - name: Stamp version
        env:
          BC_CLIENT_ID: ${{ secrets.BASECAMP_CLIENT_ID }}
          BC_CLIENT_SECRET: ${{ secrets.BASECAMP_CLIENT_SECRET }}
        run: |
          v="${TAG#v}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          python packaging/stamp.py "$v"

      - name: Tests
        run: python -m unittest discover -s tests -t . -v

      - name: Icon
        run: |
          python packaging/make_icon.py --iconset
          iconutil -c icns assets/blip.iconset -o assets/blip.icns

      - name: Build libopus (voice compression)
        run: |
          curl -fsSL -o opus.tar.gz https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz             || curl -fsSL -o opus.tar.gz https://github.com/xiph/opus/releases/download/v1.5.2/opus-1.5.2.tar.gz
          tar xzf opus.tar.gz
          cmake -S opus-1.5.2 -B opus-build -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release             -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_OSX_ARCHITECTURES=arm64 -DOPUS_BUILD_TESTING=OFF -DOPUS_BUILD_PROGRAMS=OFF
          cmake --build opus-build --config Release -j 4
          mkdir -p vendor
          cp "$(ls opus-build/libopus.*.dylib | head -1)" vendor/libopus.0.dylib
          install_name_tool -id @rpath/libopus.0.dylib vendor/libopus.0.dylib
          ls -la vendor

      - name: Build Blip.app
        run: pyinstaller --noconfirm --clean packaging/blip_mac.spec

      - name: Smoke test the app starts
        run: |
          ./dist/Blip.app/Contents/MacOS/Blip &
          pid=$!
          sleep 12
          if ! kill -0 $pid 2>/dev/null; then echo "Blip.app exited early"; exit 1; fi
          echo "Dock check (UIElement = no Dock icon):"; lsappinfo info -only ApplicationType $pid || true
          kill $pid
          # HTTPS must work from inside the bundle (updates, Basecamp) without the build machine's Python
          sudo mv /Library/Frameworks/Python.framework /tmp/pyfw-hidden 2>/dev/null || true
          ./dist/Blip.app/Contents/MacOS/Blip --selftest-https
          ./dist/Blip.app/Contents/MacOS/Blip --selftest-opus
          sudo mv /tmp/pyfw-hidden /Library/Frameworks/Python.framework 2>/dev/null || true
          if [ -f "$HOME/Library/Application Support/Blip/error.log" ]; then cat "$HOME/Library/Application Support/Blip/error.log"; exit 1; fi

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Blip.app Blip-mac-arm64.zip
          shasum -a 256 Blip-mac-arm64.zip > Blip-mac-arm64.zip.sha256
          gh release upload "$TAG" Blip-mac-arm64.zip Blip-mac-arm64.zip.sha256 --clobber
