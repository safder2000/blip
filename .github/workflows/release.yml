name: release

# Push a tag like v0.8.0 ->
#   Windows: tests, Blip.exe (Rust), BlipSetup-0.8.0.exe (Inno Setup), GitHub release
#   macOS:   Blip.app (Rust) zipped as Blip-mac-arm64.zip, added to the same release
#   Linux:   the Blip server as one static binary
# Every file gets a .sha256 next to it. Installed Blips (Python or Rust) pick the new version up on
# their own. A tag with a dash (v0.8.0-rc.1) makes a pre-release, which installed Blips ignore.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:          # re-run just the Mac build for an existing release
    inputs:
      tag:
        description: "Release tag, e.g. v0.8.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Stamp version
        shell: pwsh
        env:
          BC_CLIENT_ID: ${{ secrets.BASECAMP_CLIENT_ID }}
          BC_CLIENT_SECRET: ${{ secrets.BASECAMP_CLIENT_SECRET }}
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python packaging/stamp.py $v

      - name: Tests
        working-directory: rust
        run: cargo test --workspace --release

      - name: Get libopus (voice compression)
        shell: pwsh
        run: |
          python -m pip download discord.py==2.4.0 --no-deps -d opusdl
          New-Item -ItemType Directory -Force vendor | Out-Null
          python -c "import zipfile,glob; z=zipfile.ZipFile(glob.glob('opusdl/*.whl')[0]); open('vendor/opus.dll','wb').write(z.read('discord/bin/libopus-0.x64.dll'))"

      - name: Build Blip.exe
        working-directory: rust
        run: cargo build --release -p blip-app

      - name: Stage files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\Blip | Out-Null
          Copy-Item rust\target\release\blip.exe dist\Blip\Blip.exe
          Copy-Item vendor\opus.dll dist\Blip\opus.dll
          Get-ChildItem dist\Blip

      - name: Self-tests (bundled Opus, HTTPS, starts and keeps running)
        shell: pwsh
        run: |
          foreach ($t in "--selftest-opus", "--selftest-https") {
            $p = Start-Process dist\Blip\Blip.exe -ArgumentList $t -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\selftest.txt"
            Get-Content "$env:RUNNER_TEMP\selftest.txt"
            if ($p.ExitCode -ne 0) { Write-Error "$t failed"; exit 1 }
          }
          $env:BLIP_DATA = "$env:RUNNER_TEMP\blipdata"
          $p = Start-Process dist\Blip\Blip.exe -PassThru
          Start-Sleep 10
          if ($p.HasExited) { Write-Error "Blip.exe exited early ($($p.ExitCode))"; exit 1 }
          Stop-Process $p.Id
          "self-tests ok"

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc /DMyAppVersion=$env:VERSION packaging\blip.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $name = "BlipSetup-$env:VERSION.exe"
          $exe = "dist\$name"
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Out-File -FilePath "$exe.sha256" -Encoding ascii -NoNewline
          $pre = @()
          if ("${{ github.ref_name }}".Contains("-")) { $pre = @("--prerelease") }
          # the Hoops add-on: downloaded only by people who get it in the shop
          $game = "dist/blip-hoops-windows-x64.exe"
          Copy-Item rust/target/release/blip-hoops.exe $game
          $gh = (Get-FileHash $game -Algorithm SHA256).Hash.ToLower()
          "$gh  blip-hoops-windows-x64.exe" | Out-File -FilePath "$game.sha256" -Encoding ascii -NoNewline
          gh release create "${{ github.ref_name }}" $exe "$exe.sha256" $game "$game.sha256" --title "Blip $env:VERSION" --generate-notes @pre

  mac:
    needs: build
    if: always() && (needs.build.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Stamp version
        env:
          BC_CLIENT_ID: ${{ secrets.BASECAMP_CLIENT_ID }}
          BC_CLIENT_SECRET: ${{ secrets.BASECAMP_CLIENT_SECRET }}
        run: |
          v="${TAG#v}"
          echo "VERSION=$v" >> "$GITHUB_ENV"
          python packaging/stamp.py "$v"

      - name: Icon
        run: |
          python -m pip install pillow==11.0.0
          python packaging/make_icon.py --iconset
          iconutil -c icns assets/blip.iconset -o assets/blip.icns

      - name: Build libopus (voice compression)
        run: |
          curl -fsSL -o opus.tar.gz https://downloads.xiph.org/releases/opus/opus-1.5.2.tar.gz || curl -fsSL -o opus.tar.gz https://github.com/xiph/opus/releases/download/v1.5.2/opus-1.5.2.tar.gz
          tar xzf opus.tar.gz
          cmake -S opus-1.5.2 -B opus-build -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 -DCMAKE_OSX_ARCHITECTURES=arm64 -DOPUS_BUILD_TESTING=OFF -DOPUS_BUILD_PROGRAMS=OFF
          cmake --build opus-build --config Release -j 4
          mkdir -p vendor
          cp "$(ls opus-build/libopus.*.dylib | head -1)" vendor/libopus.0.dylib
          install_name_tool -id @rpath/libopus.0.dylib vendor/libopus.0.dylib

      - name: Build Blip.app
        run: |
          (cd rust && MACOSX_DEPLOYMENT_TARGET=11.0 cargo build --release -p blip-app)
          bash packaging/make_mac_app.sh "$VERSION" rust/target/release/blip vendor/libopus.0.dylib dist

      - name: Smoke test the app
        run: |
          ./dist/Blip.app/Contents/MacOS/Blip --selftest-opus
          ./dist/Blip.app/Contents/MacOS/Blip --selftest-https
          BLIP_DATA="$RUNNER_TEMP/blipdata" ./dist/Blip.app/Contents/MacOS/Blip &
          pid=$!
          sleep 12
          if ! kill -0 $pid 2>/dev/null; then echo "Blip.app exited early"; exit 1; fi
          echo "Dock check (UIElement = no Dock icon):"; lsappinfo info -only ApplicationType $pid || true
          kill $pid

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Blip.app Blip-mac-arm64.zip
          shasum -a 256 Blip-mac-arm64.zip > Blip-mac-arm64.zip.sha256
          # the Hoops add-on, ad-hoc signed like the app
          cp ../rust/target/release/blip-hoops blip-hoops-mac-arm64
          codesign --force -s - blip-hoops-mac-arm64
          shasum -a 256 blip-hoops-mac-arm64 > blip-hoops-mac-arm64.sha256
          gh release upload "$TAG" Blip-mac-arm64.zip Blip-mac-arm64.zip.sha256 blip-hoops-mac-arm64 blip-hoops-mac-arm64.sha256 --clobber

  server:
    # The Rust Blip server as a single static Linux binary (runs on any x86-64 Linux, NAS or VPS)
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build static binary
        working-directory: rust
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          rustup target add x86_64-unknown-linux-musl
          cargo build --release -p blip-server --target x86_64-unknown-linux-musl
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp rust/target/x86_64-unknown-linux-musl/release/blip-server blip-server-linux-x64
          sha256sum blip-server-linux-x64 > blip-server-linux-x64.sha256
          gh release upload "${{ github.ref_name }}" blip-server-linux-x64 blip-server-linux-x64.sha256 --clobber
