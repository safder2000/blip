name: rust

# The Rust port: its own tests, plus the Python test suite run against the Rust server,
# which proves today's Python pets work with it unchanged.
on:
  push:
    paths: ["rust/**", "tests/**", "blip/**", "Dockerfile", ".github/workflows/rust.yml"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Rust tests (wire format matches Python byte for byte)
        working-directory: rust
        run: cargo test --workspace

      - name: Build the server
        working-directory: rust
        run: cargo build --release -p blip-server

      - name: Python pets through the Rust server
        env:
          BLIP_SERVER_BIN: rust/target/release/blip-server
        run: python -m unittest tests.test_net tests.test_voice -v

      - name: Docker image builds
        run: docker build -t blip-server . && docker run -d --name blipsrv -p 47620:47620 blip-server && sleep 2 && curl -fsS http://127.0.0.1:47620/health

  app:
    # The desktop pet on both systems: builds, then runs for a few seconds without crashing
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Pet tests (sprites match Python, physics)
        working-directory: rust
        run: cargo test -p blip-pet
      - name: Build the app
        working-directory: rust
        run: cargo build --release -p blip-app
      - name: It starts and keeps running (Mac)
        if: runner.os == 'macOS'
        working-directory: rust
        run: |
          ./target/release/blip & pid=$!
          sleep 8
          kill -0 $pid && echo "still running after 8 s" && kill $pid
      - name: It starts and keeps running (Windows)
        if: runner.os == 'Windows'
        working-directory: rust
        shell: pwsh
        run: |
          $p = Start-Process .\target\release\blip.exe -PassThru
          Start-Sleep 8
          if ($p.HasExited) { Write-Error "blip.exe exited with $($p.ExitCode)"; exit 1 }
          "still running after 8 s"; Stop-Process -Id $p.Id
